<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>365 Reasons I Love You</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="word-bg" id="wordBg"></div>

  <div class="container">

    <h1 class="title">Every Reason Leads to You</h1>


    <!-- WEATHER -->
    <div class="weather-card">

      <div class="location">
        📍 Omaha, Nebraska
      </div>

      <div class="weather-main">
        <span id="weatherIcon">☀️</span>
        <span id="temperature">--°</span>
      </div>

      <div id="weatherText">
        Loading weather...
      </div>

    </div>



    <!-- LOVE MESSAGE -->

    <div class="card">

      <div class="meta">

        <h2 id="dayTitle">
          Day
        </h2>

        <div class="divider"></div>

      </div>


      <p id="message">
        Loading...
      </p>


    </div>


  </div>


  <script src="script.js"></script>

</body>
</html>
